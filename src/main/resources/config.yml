# FactionPlugin Configuration
settings:
  discord:
    webhook-url: "votre_webhook_ici"
    log-bans: true
    log-mutes: true
    log-factions: true
  power:
    per-death: 2.0
    per-interval: 0.2
    interval-minutes: 5
    max-default: 10.0
    min-default: -10.0

messages:
  prefix: "§6[TPC Faction] "
  no-permission: "§cVous n'avez pas la permission: %perm%"
  only-players: "§cSeuls les joueurs peuvent utiliser cette commande."

  # Faction Lifecycle
  faction-created: "§aFaction %name% créée avec succès !"
  faction-disbanded: "§aVotre faction a été dissoute."
  joined-faction: "§aVous avez rejoint la faction %name%."
  left-faction: "§aVous avez quitté la faction."
  renamed-faction: "§aFaction renommée en %name%."
  name-taken: "§cCe nom de faction est déjà pris."
  faction-not-found: "§cCette faction n'existe pas."

  # Membership
  not-in-faction: "§cVous n'êtes pas dans une faction."
  already-in-faction: "§cVous êtes déjà dans une faction."
  target-not-in-faction: "§cCe joueur n'est pas dans votre faction."
  invited: "§aVous avez invité %target% dans la faction."
  invite-received: "§aVous avez été invité à rejoindre la faction %name%. Utilisez /f join %name% pour accepter."
  kicked: "§a%target% a été exclu de la faction."
  kicked-received: "§cVous avez été exclu de votre faction."
  promoted: "§a%target% a été promu officier."
  demoted: "§a%target% a été rétrogradé membre."
  new-leader: "§aVous avez nommé %target% comme nouveau chef de la faction."

  # Permissions & Roles
  not-officer: "§cSeuls les officiers peuvent faire cela."
  not-leader: "§cSeul le chef peut faire cela."
  cannot-kick-leader: "§cVous ne pouvez pas exclure le chef."
  cannot-kick-officer: "§cSeul le chef peut exclure un officier."

  # Claims
  claim-success: "§aParcelle revendiquée avec succès !"
  claim-already-owned: "§cCette parcelle est déjà possédée."
  claim-not-enough-power: "§cVotre faction n'a pas assez de power pour claim cette parcelle."
  unclaim-success: "§aParcelle libérée."
  unclaim-all: "§aToutes les parcelles ont été libérées."
  not-your-claim: "§cCette parcelle ne vous appartient pas."
  claim-protection: "§cCette parcelle appartient à une autre faction."

  # Relations
  relation-updated: "§aRelation avec %target% mise à jour: %relation%"
