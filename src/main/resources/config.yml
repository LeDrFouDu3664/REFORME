  relation-truce-request: "§6La faction %name% souhaite une trêve. Utilisez /f truce %name% pour accepter."
  relation-war-declared: "§cLa faction %name% vous a déclaré la guerre !"
  pvp-denied-same-faction: "§cLe PvP est désactivé entre les membres d'une même faction."
  pvp-denied-relation: "§cLe PvP est désactivé avec les factions alliées ou en trêve."

  # Power
  power-loss: "§cVous avez perdu %amount% de power. Power actuel: %current%"
  power-status: "§aVotre power: %current%/%max%"

  # Teleportation
  teleport-success: "§aTéléportation réussie."
  tpa-sent: "§aDemande de téléportation envoyée à %target%."
  tpa-received: "§a%player% souhaite se téléporter à vous. Utilisez /tpyes ou /tpno."
  tpahere-sent: "§aDemande de téléportation (ici) envoyée à %target%."
  tpahere-received: "§a%player% souhaite que vous vous téléportiez à lui. Utilisez /tpyes ou /tpno."
  no-pending-request: "§cVous n'avez pas de demande en attente."
  request-denied: "§cDemande refusée."
  home-set: "§aRésidence '%name%' définie avec succès."
  home-teleport: "§aTéléportation à votre résidence '%name%'."
  faction-home-set: "§aHome de la faction défini."
  faction-home-unset: "§aHome de la faction supprimé."
  faction-home-teleport: "§aTéléportation au home de la faction %name%."
  spawn-teleport: "§aTéléportation au spawn."

  # Chat
  chat-mode-switched: "§aChat: %mode%"

  # Misc
  money-status: "§aArgent: %amount%$"
  shop-open: "§aOuverture de la boutique Faction."
  boutique-open: "§aOuverture de la boutique Me's."

  # Admin
  admin-faction-disbanded: "§aFaction %name% dissoute par un administrateur."
  bypass-mode: "§aMode bypass: %status%"
