  rank-updated: "§aLe rank de %target% a été mis à %rank%."
  rank-received: "§6§l[Rank] §aFélicitations ! Vous avez été promu au grade %rank% !"
  ec-open: "§aOuverture de l'ender chest."
  staff-activated: "§a§l[Staff] §aMode Staff activé."
  staff-deactivated: "§c§l[Staff] §cMode Staff désactivé. Inventaire restauré."
  objective-no-possession: "§cVotre faction ne possède pas %objective% actuellement."
  objective-teleport: "§aTéléportation au/à la %objective% !"

  # Faction Lists
  list-header: "§6--- Liste des Factions ---"
  list-entry: "§e%pos%. %name% §7(Power: %power%)"
  status-header: "§6--- Statut: %name% ---"
  status-entry: "§e%player% §7- Power: %power% %status%"

