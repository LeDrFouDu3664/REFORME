# Configuration du Module Pet
capture:
  lasso-name: "§bLasso de Capture"
  blocked-entities:
    - SQUID
    - GLOW_SQUID
    - COD
    - SALMON
    - TROPICAL_FISH
    - PUFFERFISH
    - DOLPHIN
    - GUARDIAN
    - ELDER_GUARDIAN
    - TADPOLE
  refusal-message: "§cCette créature ne peut pas vivre hors de l'eau ! Impossible de la capturer."

