      slot: 10
      material: BOOK
      name: "§eInformations"
    rename:
      slot: 12
      material: NAME_TAG
      name: "§eRenommer"
    summon:
      slot: 13
      material: BONE
      name: "§aInvoquer"
    equipment:
      slot: 14
      material: SADDLE
      name: "§eEquipement"
    dismiss:
      slot: 16
      material: BARRIER
      name: "§cRenvoyer"

powers:
  combat:
    name: "Guerrier"
    skills:
      sharpness: "Tranchant"
      defense: "Peau de Pierre"
  utility:
    name: "Soutien"
    skills:
      healing: "Soin Rapide"
      speed: "Vitesse"

messages:
  death: "§cVotre compagnon %name% est mort ! Il sera indisponible pendant 10 minutes."
  summon: "§aVous avez invoqué %name% !"
  store: "§eVous avez rangé %name%."
  level-up: "§6§lFÉLICITATIONS ! §e%name% est passé au niveau %level% !"
